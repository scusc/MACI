[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trip-service"
version = "0.1.0"
description = "MACI Trip Microservice"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "maci-core"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
