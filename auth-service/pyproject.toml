[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auth-service"
version = "0.1.0"
description = "MACI Auth Microservice"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "maci-core",
    "plaid-python>=15.1.0",
    "httpx>=0.27.0"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
