name: Rally CI/CD Deployment Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY_NAME: acrmacidev123
  CLUSTER_NAME: aks-maci-dev
  RESOURCE_GROUP: rg-maci-dev-eastus

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Backend Syntax Verification
        run: |
          pip install --no-cache-dir -e "./maci-core"
          python3 -m py_compile $(find . -name "*.py" -not -path "*/.venv/*" -not -path "*/__pycache__/*")

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Angular Frontend Production Build
        run: |
          cd frontend
          npm ci
          npx nx build frontend --configuration=production

  build-and-deploy:
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Production Angular Bundle
        run: |
          cd frontend
          npm ci
          npx nx build frontend --configuration=production

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Microservice Images
        run: |
          echo "Building Auth Service..."
          docker build -t ${{ env.REGISTRY_NAME }}.azurecr.io/auth-service:latest -f auth-service/Dockerfile .
          docker push ${{ env.REGISTRY_NAME }}.azurecr.io/auth-service:latest

          echo "Building Asset Service..."
          docker build -t ${{ env.REGISTRY_NAME }}.azurecr.io/asset-service:latest -f asset-service/Dockerfile .
          docker push ${{ env.REGISTRY_NAME }}.azurecr.io/asset-service:latest

          echo "Building Group Service..."
          docker build --build-arg SERVICE_NAME=group-service -t ${{ env.REGISTRY_NAME }}.azurecr.io/group-service:latest -f Dockerfile .
          docker push ${{ env.REGISTRY_NAME }}.azurecr.io/group-service:latest

          echo "Building Payment Service..."
          docker build --build-arg SERVICE_NAME=payment-service -t ${{ env.REGISTRY_NAME }}.azurecr.io/payment-service:latest -f Dockerfile .
          docker push ${{ env.REGISTRY_NAME }}.azurecr.io/payment-service:latest

          echo "Building API Gateway..."
          docker build --build-arg SERVICE_NAME=api-gateway -t ${{ env.REGISTRY_NAME }}.azurecr.io/api-gateway:latest -f Dockerfile .
          docker push ${{ env.REGISTRY_NAME }}.azurecr.io/api-gateway:latest

          echo "Building Angular Frontend..."
          docker build -t ${{ env.REGISTRY_NAME }}.azurecr.io/frontend:latest -f frontend/Dockerfile frontend/
          docker push ${{ env.REGISTRY_NAME }}.azurecr.io/frontend:latest

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.CLUSTER_NAME }}

      - name: Deploy Manifests to AKS
        run: |
          kubectl apply -f k8s/frontend.yaml
          kubectl apply -f k8s/rally-platform.yaml
          kubectl rollout restart deployment -n rally
