name: Rally CI/CD Deployment Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY_NAME: acrmacidev2025
  CLUSTER_NAME: aks-maci-dev
  RESOURCE_GROUP: rg-maci-dev-eastus

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ env.REGISTRY_NAME }}

      # Build all backend microservices via ACR Build Tasks (fast, cloud-native)
      - name: Build Auth Service (ACR Task)
        run: |
          az acr build --registry ${{ env.REGISTRY_NAME }} \
            --image auth-service:latest \
            --file auth-service/Dockerfile \
            --platform linux/amd64 \
            --no-wait \
            .

      - name: Build Asset Service (ACR Task)
        run: |
          az acr build --registry ${{ env.REGISTRY_NAME }} \
            --image asset-service:latest \
            --file asset-service/Dockerfile \
            --platform linux/amd64 \
            --no-wait \
            .

      - name: Build Group Service (ACR Task)
        run: |
          az acr build --registry ${{ env.REGISTRY_NAME }} \
            --image group-service:latest \
            --file Dockerfile \
            --build-arg SERVICE_NAME=group-service \
            --platform linux/amd64 \
            --no-wait \
            .

      - name: Build Payment Service (ACR Task)
        run: |
          az acr build --registry ${{ env.REGISTRY_NAME }} \
            --image payment-service:latest \
            --file Dockerfile \
            --build-arg SERVICE_NAME=payment-service \
            --platform linux/amd64 \
            --no-wait \
            .

      - name: Build API Gateway (ACR Task)
        run: |
          az acr build --registry ${{ env.REGISTRY_NAME }} \
            --image api-gateway:latest \
            --file Dockerfile \
            --build-arg SERVICE_NAME=api-gateway \
            --platform linux/amd64 \
            --no-wait \
            .

      # Frontend: build locally on runner (node_modules excluded from ACR)
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Angular Frontend
        working-directory: frontend
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: |
          npm ci --legacy-peer-deps
          npx nx build --configuration=production

      - name: Build & Push Frontend Docker Image
        working-directory: frontend
        run: |
          docker build \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -t ${{ env.REGISTRY_NAME }}.azurecr.io/frontend:latest \
            -f Dockerfile \
            .
          docker push ${{ env.REGISTRY_NAME }}.azurecr.io/frontend:latest

      # Wait for all ACR builds to finish
      - name: Wait for ACR Builds to Complete
        run: |
          echo "Waiting for ACR build tasks to complete..."
          sleep 30
          for img in auth-service asset-service group-service payment-service api-gateway; do
            echo "Checking $img..."
            LAST=$(az acr task list-runs --registry ${{ env.REGISTRY_NAME }} \
              --filter "imageName=eq:$img" \
              --query "[0].status" -o tsv 2>/dev/null || echo "Unknown")
            echo "$img last build: $LAST"
          done

      - name: Set AKS Context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.CLUSTER_NAME }}

      - name: Deploy Manifests to AKS
        run: |
          kubectl apply -f k8s/rally-platform.yaml
          kubectl apply -f k8s/frontend.yaml
          kubectl rollout restart deployment -n rally
          echo "Waiting for rollout..."
          kubectl rollout status deployment/frontend -n rally --timeout=120s || true
          kubectl rollout status deployment/api-gateway -n rally --timeout=120s || true
          kubectl get svc -n rally
