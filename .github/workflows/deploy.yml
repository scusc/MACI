name: Rally CI/CD Deployment Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: acrmacidev2025.azurecr.io
  CLUSTER_NAME: aks-maci-dev
  RESOURCE_GROUP: rg-maci-dev-eastus
  SUBSCRIPTION_ID: 116d28c2-d28d-424f-b0d7-e9d4987f366d

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set correct Azure subscription
        run: az account set --subscription ${{ env.SUBSCRIPTION_ID }}

      - name: Log in to ACR (admin credentials)
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login \
            ${{ env.REGISTRY }} \
            -u "${{ secrets.ACR_USERNAME }}" \
            --password-stdin

      # ── Set up Docker Buildx for efficient caching ──────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Build & push all backend microservices ──────────────────────────
      - name: Build & Push Auth Service
        run: |
          docker build --platform linux/amd64 \
            -t ${{ env.REGISTRY }}/auth-service:latest \
            -f auth-service/Dockerfile \
            .
          docker push ${{ env.REGISTRY }}/auth-service:latest

      - name: Build & Push Asset Service
        run: |
          docker build --platform linux/amd64 \
            -t ${{ env.REGISTRY }}/asset-service:latest \
            -f asset-service/Dockerfile \
            .
          docker push ${{ env.REGISTRY }}/asset-service:latest

      - name: Build & Push Group Service
        run: |
          docker build --platform linux/amd64 \
            --build-arg SERVICE_NAME=group-service \
            -t ${{ env.REGISTRY }}/group-service:latest \
            -f Dockerfile \
            .
          docker push ${{ env.REGISTRY }}/group-service:latest

      - name: Build & Push Payment Service
        run: |
          docker build --platform linux/amd64 \
            --build-arg SERVICE_NAME=payment-service \
            -t ${{ env.REGISTRY }}/payment-service:latest \
            -f Dockerfile \
            .
          docker push ${{ env.REGISTRY }}/payment-service:latest

      - name: Build & Push API Gateway
        run: |
          docker build --platform linux/amd64 \
            --build-arg SERVICE_NAME=api-gateway \
            -t ${{ env.REGISTRY }}/api-gateway:latest \
            -f Dockerfile \
            .
          docker push ${{ env.REGISTRY }}/api-gateway:latest

      # ── Build Angular frontend then Docker image ────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Angular Frontend
        working-directory: frontend
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: |
          npm ci --legacy-peer-deps
          npx nx build --configuration=production

      - name: Build & Push Frontend Docker Image
        run: |
          docker build --platform linux/amd64 \
            -t ${{ env.REGISTRY }}/frontend:latest \
            -f frontend/Dockerfile \
            frontend/
          docker push ${{ env.REGISTRY }}/frontend:latest

      # ── Deploy to AKS ───────────────────────────────────────────────────
      - name: Set AKS Context
        run: |
          az aks get-credentials \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.CLUSTER_NAME }} \
            --subscription ${{ env.SUBSCRIPTION_ID }} \
            --overwrite-existing

      - name: Deploy Manifests to AKS
        run: |
          kubectl apply -f k8s/rally-platform.yaml
          kubectl apply -f k8s/frontend.yaml
          kubectl rollout restart deployment -n rally
          echo "=== Waiting for deployments ==="
          kubectl rollout status deployment/api-gateway -n rally --timeout=240s || true
          kubectl rollout status deployment/frontend -n rally --timeout=240s || true
          echo "=== Services ==="
          kubectl get svc -n rally
          echo "=== Pods ==="
          kubectl get pods -n rally
