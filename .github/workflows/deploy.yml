name: Slice CI/CD to Azure AKS

on:
  push:
    branches:
      - main

env:
  REGISTRY_NAME: sliceacr
  CLUSTER_NAME: aks-slice-dev
  RESOURCE_GROUP: rg-slice-dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run Tests (Pytest)
        run: |
          pip install ./maci-core
          pip install -r group-service/requirements.txt
          pip install pytest pytest-asyncio httpx
          cd group-service
          PYTHONPATH=. pytest tests

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Run Database Migrations (Alembic)
        run: |
          pip install alembic psycopg2-binary
          cd db-migrations
          alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Backend (Auth Service)
        run: |
          docker build --build-arg SERVICE_NAME=auth-service -t ${{ env.REGISTRY_NAME }}.azurecr.io/auth-service:${{ github.sha }} -f Dockerfile .
          docker push ${{ env.REGISTRY_NAME }}.azurecr.io/auth-service:${{ github.sha }}

      - name: Build and Push Backend (Asset Service)
        run: |
          docker build --build-arg SERVICE_NAME=asset-service -t ${{ env.REGISTRY_NAME }}.azurecr.io/asset-service:${{ github.sha }} -f Dockerfile .
          docker push ${{ env.REGISTRY_NAME }}.azurecr.io/asset-service:${{ github.sha }}

      - name: Build and Push Backend (Payment Service)
        run: |
          docker build --build-arg SERVICE_NAME=payment-service -t ${{ env.REGISTRY_NAME }}.azurecr.io/payment-service:${{ github.sha }} -f Dockerfile .
          docker push ${{ env.REGISTRY_NAME }}.azurecr.io/payment-service:${{ github.sha }}
          
      - name: Build and Push Backend (Group Service)
        run: |
          docker build --build-arg SERVICE_NAME=group-service -t ${{ env.REGISTRY_NAME }}.azurecr.io/group-service:${{ github.sha }} -f Dockerfile .
          docker push ${{ env.REGISTRY_NAME }}.azurecr.io/group-service:${{ github.sha }}
          
      - name: Build and Push Backend (API Gateway)
        run: |
          docker build --build-arg SERVICE_NAME=api-gateway -t ${{ env.REGISTRY_NAME }}.azurecr.io/api-gateway:${{ github.sha }} -f Dockerfile .
          docker push ${{ env.REGISTRY_NAME }}.azurecr.io/api-gateway:${{ github.sha }}

      - name: Build and Push Backend (Trip Service)
        run: |
          docker build --build-arg SERVICE_NAME=trip-service -t ${{ env.REGISTRY_NAME }}.azurecr.io/trip-service:${{ github.sha }} -f Dockerfile .
          docker push ${{ env.REGISTRY_NAME }}.azurecr.io/trip-service:${{ github.sha }}

      - name: Build and Push Backend (Notification Service)
        run: |
          docker build --build-arg SERVICE_NAME=notification-service -t ${{ env.REGISTRY_NAME }}.azurecr.io/notification-service:${{ github.sha }} -f Dockerfile .
          docker push ${{ env.REGISTRY_NAME }}.azurecr.io/notification-service:${{ github.sha }}

      - name: Build and Push Frontend
        run: |
          cd frontend
          docker build -t ${{ env.REGISTRY_NAME }}.azurecr.io/frontend:${{ github.sha }} -f Dockerfile .
          docker push ${{ env.REGISTRY_NAME }}.azurecr.io/frontend:${{ github.sha }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.CLUSTER_NAME }}

      - name: Deploy to AKS
        uses: Azure/k8s-deploy@v4
        with:
          manifests: |
            k8s/rally-platform.yaml
            k8s/frontend.yaml
          images: |
            ${{ env.REGISTRY_NAME }}.azurecr.io/auth-service:${{ github.sha }}
            ${{ env.REGISTRY_NAME }}.azurecr.io/asset-service:${{ github.sha }}
            ${{ env.REGISTRY_NAME }}.azurecr.io/payment-service:${{ github.sha }}
            ${{ env.REGISTRY_NAME }}.azurecr.io/group-service:${{ github.sha }}
            ${{ env.REGISTRY_NAME }}.azurecr.io/api-gateway:${{ github.sha }}
            ${{ env.REGISTRY_NAME }}.azurecr.io/trip-service:${{ github.sha }}
            ${{ env.REGISTRY_NAME }}.azurecr.io/notification-service:${{ github.sha }}
            ${{ env.REGISTRY_NAME }}.azurecr.io/frontend:${{ github.sha }}
