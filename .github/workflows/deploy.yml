name: Rally CI/CD Deployment Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY_NAME: acrmacidev2025
  CLUSTER_NAME: aks-maci-dev
  RESOURCE_GROUP: rg-maci-dev-eastus
  SUBSCRIPTION_ID: 116d28c2-d28d-424f-b0d7-e9d4987f366d

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set correct Azure subscription
        run: az account set --subscription ${{ env.SUBSCRIPTION_ID }}

      - name: Log in to ACR (admin credentials)
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login \
            ${{ env.REGISTRY_NAME }}.azurecr.io \
            -u "${{ secrets.ACR_USERNAME }}" \
            --password-stdin

      # Build backend services via ACR Build Tasks (cloud-native, no local push)
      - name: Build Auth Service (ACR Task)
        run: |
          az acr build --registry ${{ env.REGISTRY_NAME }} \
            --subscription ${{ env.SUBSCRIPTION_ID }} \
            --image auth-service:latest \
            --file auth-service/Dockerfile \
            --platform linux/amd64 \
            .

      - name: Build Asset Service (ACR Task)
        run: |
          az acr build --registry ${{ env.REGISTRY_NAME }} \
            --subscription ${{ env.SUBSCRIPTION_ID }} \
            --image asset-service:latest \
            --file asset-service/Dockerfile \
            --platform linux/amd64 \
            .

      - name: Build Group Service (ACR Task)
        run: |
          az acr build --registry ${{ env.REGISTRY_NAME }} \
            --subscription ${{ env.SUBSCRIPTION_ID }} \
            --image group-service:latest \
            --file Dockerfile \
            --build-arg SERVICE_NAME=group-service \
            --platform linux/amd64 \
            .

      - name: Build Payment Service (ACR Task)
        run: |
          az acr build --registry ${{ env.REGISTRY_NAME }} \
            --subscription ${{ env.SUBSCRIPTION_ID }} \
            --image payment-service:latest \
            --file Dockerfile \
            --build-arg SERVICE_NAME=payment-service \
            --platform linux/amd64 \
            .

      - name: Build API Gateway (ACR Task)
        run: |
          az acr build --registry ${{ env.REGISTRY_NAME }} \
            --subscription ${{ env.SUBSCRIPTION_ID }} \
            --image api-gateway:latest \
            --file Dockerfile \
            --build-arg SERVICE_NAME=api-gateway \
            --platform linux/amd64 \
            .

      # Frontend: build locally on runner then docker push
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Angular Frontend
        working-directory: frontend
        env:
          CYPRESS_INSTALL_BINARY: 0
        run: |
          npm ci --legacy-peer-deps
          npx nx build --configuration=production

      - name: Build & Push Frontend Docker Image
        working-directory: frontend
        run: |
          docker build \
            -t ${{ env.REGISTRY_NAME }}.azurecr.io/frontend:latest \
            -f Dockerfile \
            .
          docker push ${{ env.REGISTRY_NAME }}.azurecr.io/frontend:latest

      - name: Set AKS Context
        run: |
          az aks get-credentials \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.CLUSTER_NAME }} \
            --subscription ${{ env.SUBSCRIPTION_ID }} \
            --overwrite-existing

      - name: Deploy Manifests to AKS
        run: |
          kubectl apply -f k8s/rally-platform.yaml
          kubectl apply -f k8s/frontend.yaml
          kubectl rollout restart deployment -n rally
          echo "Waiting for rollout..."
          kubectl rollout status deployment/frontend -n rally --timeout=180s || true
          kubectl rollout status deployment/api-gateway -n rally --timeout=180s || true
          echo "=== Services ==="
          kubectl get svc -n rally
          echo "=== Pods ==="
          kubectl get pods -n rally
