name: Build and Push to ACR

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_NAME }}.azurecr.io
  AUTH_SERVICE_IMAGE: maci-auth-service
  TRIP_SERVICE_IMAGE: maci-trip-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build Auth Service
        run: |
          docker build -f auth-service/Dockerfile -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.AUTH_SERVICE_IMAGE }}:${{ github.sha }} .
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.AUTH_SERVICE_IMAGE }}:${{ github.sha }}
          
          # Tag as latest as well
          docker tag ${{ env.ACR_LOGIN_SERVER }}/${{ env.AUTH_SERVICE_IMAGE }}:${{ github.sha }} ${{ env.ACR_LOGIN_SERVER }}/${{ env.AUTH_SERVICE_IMAGE }}:latest
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.AUTH_SERVICE_IMAGE }}:latest

      - name: Build Trip Service
        run: |
          docker build -f trip-service/Dockerfile -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.TRIP_SERVICE_IMAGE }}:${{ github.sha }} .
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.TRIP_SERVICE_IMAGE }}:${{ github.sha }}
          
          # Tag as latest as well
          docker tag ${{ env.ACR_LOGIN_SERVER }}/${{ env.TRIP_SERVICE_IMAGE }}:${{ github.sha }} ${{ env.ACR_LOGIN_SERVER }}/${{ env.TRIP_SERVICE_IMAGE }}:latest
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.TRIP_SERVICE_IMAGE }}:latest

      - name: Update K8s Manifests (GitOps)
        run: |
          cd k8s/base
          # Use Kustomize to update the image tags to the newly built SHA
          kustomize edit set image ${{ env.ACR_LOGIN_SERVER }}/${{ env.AUTH_SERVICE_IMAGE }}=${{ env.ACR_LOGIN_SERVER }}/${{ env.AUTH_SERVICE_IMAGE }}:${{ github.sha }}
          kustomize edit set image ${{ env.ACR_LOGIN_SERVER }}/${{ env.TRIP_SERVICE_IMAGE }}=${{ env.ACR_LOGIN_SERVER }}/${{ env.TRIP_SERVICE_IMAGE }}:${{ github.sha }}
          
          # Commit and push the changes back to the repository
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add kustomization.yaml
          git commit -m "chore(cd): update image tags to ${{ github.sha }} [skip ci]" || echo "No changes to commit"
          git push
