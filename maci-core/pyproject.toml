[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maci-core"
version = "0.1.0"
description = "MACI Core library for shared models, schemas, and utils"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.2",
    "sqlalchemy>=2.0.35",
    "pyjwt>=2.9.0",
    "redis>=5.1.1",
    "stripe>=11.1.1",
    "fastapi>=0.115.0",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.2.1",
    "email-validator>=2.1.0.post1",
    "bcrypt>=4.1.2",
    "cryptography>=42.0.0",
    "jinja2>=3.1.0",
    "pgvector>=0.2.0",
    "azure-identity>=1.15.0",
    "azure-servicebus>=7.11.0",
    "aiofiles>=23.2.1",
    "python-multipart>=0.0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["maci_core"]
