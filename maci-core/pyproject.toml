[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maci-core"
version = "0.1.0"
description = "MACI Core library for shared models, schemas, and utils"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "sqlalchemy>=2.0.29",
    "asyncpg>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "email-validator>=2.1.0.post1",
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.2",
    "litellm>=1.35.0",
    "instructor>=1.2.0",
    "langchain>=0.2.0",
    "langgraph>=0.1.0",
    "langchain-openai>=0.1.0",
    "azure-identity>=1.15.0",
    "google-search-results>=2.4.2",
    "jinja2>=3.1.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["maci_core"]
