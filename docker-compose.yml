# MACI — Docker Compose (Production Microservices)
# Run: docker-compose up -d --build

services:
  # ── API Gateway (Exposed to Host) ──────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: api-gateway
    ports:
      - "8000:80"
    env_file: .env
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8000
      - ASSET_SERVICE_URL=http://asset-service:8000
      - GROUP_SERVICE_URL=http://group-service:80
      - PAYMENT_SERVICE_URL=http://payment-service:80
    depends_on:
      - auth-service
      - asset-service
      - group-service
      - payment-service
    restart: unless-stopped

  # ── Microservices (Internal Network Only) ──────────────────────
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  asset-service:
    build:
      context: .
      dockerfile: asset-service/Dockerfile
    ports:
      - "8002:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  group-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: group-service
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: payment-service
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── PostgreSQL & Redis ─────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: maci
      POSTGRES_USER: maci
      POSTGRES_PASSWORD: maci_dev_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maci -d maci"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
