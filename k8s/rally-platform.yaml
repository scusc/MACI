        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        - name: GROUP_SERVICE_URL
          value: "http://group-service"
        - name: DATABASE_URL
          value: "postgresql+asyncpg://maciadmin:dummy@psql2-maci-dev.postgres.database.azure.com:5432/rally?ssl=require"
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: rally
spec:
  selector:
    app: payment-service
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80

