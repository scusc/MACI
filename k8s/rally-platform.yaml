apiVersion: v1
kind: Namespace
metadata:
  name: rally
---
# ── API Gateway ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: rally
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: acrmacidev123.azurecr.io/api-gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        - name: GROUP_SERVICE_URL
          value: "http://group-service"
        - name: PAYMENT_SERVICE_URL
          value: "http://payment-service"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: rally
spec:
  type: LoadBalancer # Exposes the gateway to the internet
  selector:
    app: api-gateway
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80

---
# ── Group Service ────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: group-service
  namespace: rally
spec:
  replicas: 1
  selector:
    matchLabels:
      app: group-service
  template:
    metadata:
      labels:
        app: group-service
    spec:
      containers:
      - name: group-service
        image: acrmacidev123.azurecr.io/group-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        - name: TRIP_SERVICE_URL
          value: "http://trip-service"
        # In a real environment, DB URL comes from Key Vault via CSI Driver.
        # Hardcoding the mock for the template placeholder.
        - name: DATABASE_URL
          value: "postgresql+asyncpg://maciadmin:dummy@psql2-maci-dev.postgres.database.azure.com:5432/rally?ssl=require"
---
apiVersion: v1
kind: Service
metadata:
  name: group-service
  namespace: rally
spec:
  selector:
    app: group-service
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80

---
# ── Payment Service ──────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: rally
spec:
  replicas: 1
