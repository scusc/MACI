apiVersion: v1
kind: Namespace
metadata:
  name: rally
---
# ── API Gateway ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: rally
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: acrmacidev2025.azurecr.io/api-gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: AUTH_SERVICE_URL
          value: "http://auth-service:8000"
        - name: ASSET_SERVICE_URL
          value: "http://asset-service:8000"
        - name: GROUP_SERVICE_URL
          value: "http://group-service:8000"
        - name: PAYMENT_SERVICE_URL
          value: "http://payment-service:8000"
        - name: JWT_SECRET_KEY
          value: "maci-super-secret-production-key-2026"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: rally
spec:
  type: LoadBalancer # Public API gateway entrypoint
  selector:
    app: api-gateway
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000

---
# ── Auth Service ─────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: rally
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: acrmacidev2025.azurecr.io/auth-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: "postgresql+asyncpg://maciadmin:p%2BY%5Bp2A.zuj.7efn5QT%3DYiHx7-NBZ%5DD%24@psql3-maci-dev.postgres.database.azure.com:5432/rally?ssl=require"
        - name: REDIS_URL
          value: "redis://:gbyJCelLLLEZ6fwYQatC6iUoW2YMNJYMfAzCaEVPGys=@redis-maci-dev-456.redis.cache.windows.net:6380"
        - name: JWT_SECRET_KEY
          value: "maci-super-secret-production-key-2026"
        - name: GOOGLE_CLIENT_ID
          value: "1043294374752-lumvimthmun0lv7sljjv21hbf31t48n4.apps.googleusercontent.com"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: rally
spec:
  selector:
    app: auth-service
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000

---
# ── Asset Service ────────────────────────────────────────────────────────────
apiVersion: apps/v1
