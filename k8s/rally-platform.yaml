apiVersion: v1
kind: Namespace
metadata:
  name: rally
---
# ── API Gateway ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: rally
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: acrmacidev123.azurecr.io/api-gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: AUTH_SERVICE_URL
          value: "http://auth-service:8000"
        - name: ASSET_SERVICE_URL
          value: "http://asset-service:8000"
        - name: GROUP_SERVICE_URL
          value: "http://group-service:8000"
        - name: PAYMENT_SERVICE_URL
          value: "http://payment-service:8000"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: rally
spec:
  type: LoadBalancer # Public API gateway entrypoint
  selector:
    app: api-gateway
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000

---
# ── Auth Service ─────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: rally
spec:
  replicas: 1
