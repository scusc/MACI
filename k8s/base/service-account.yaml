# ── ServiceAccount with Workload Identity ─────────────────────────────
# 🎓 LESSON: This is the Kubernetes side of the Workload Identity chain.
#
# In identity.tf, we created:
#   1. An Azure Managed Identity
#   2. A Federated Identity Credential pointing to THIS ServiceAccount
#
# By adding the annotation below, the AKS Workload Identity webhook
# automatically injects Azure AD tokens into any pod that uses this
# ServiceAccount. The pod can then call:
#   DefaultAzureCredential() → automatically picks up the token
#   → authenticates to Key Vault → reads secrets
#
# The annotation value is the CLIENT_ID of the Managed Identity.
# We'll fill it in after terraform apply completes.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: maci-workload-sa
  namespace: maci
  annotations:
    # This will be populated after terraform apply with the Managed Identity Client ID
    azure.workload.identity/client-id: "f5e9755e-6c52-43a9-8ca4-85c4cf441dea"
  labels:
    azure.workload.identity/use: "true"
    app.kubernetes.io/part-of: maci
