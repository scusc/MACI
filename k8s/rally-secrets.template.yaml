apiVersion: v1
kind: Secret
metadata:
  name: rally-core-secrets
  namespace: rally
type: Opaque
data:
  # All values below MUST be Base64 encoded. 
  # Example: echo -n 'my-secret' | base64
  DATABASE_URL: <BASE64_ENCODED_DB_URL>
  REDIS_URL: <BASE64_ENCODED_REDIS_URL>
  JWT_SECRET_KEY: <BASE64_ENCODED_JWT_SECRET>
  SERVICE_BUS_CONNECTION_STRING: <BASE64_ENCODED_SERVICE_BUS_STRING>
  SERPAPI_API_KEY: <BASE64_ENCODED_SERPAPI_KEY>
