<app-toast-container></app-toast-container>

<div class="layout-wrapper">
  <header class="site-header" role="banner">
    <div class="header-content">
      <a class="header-brand" routerLink="/feed" (click)="closeMobileMenu()">
        <span class="brand-name">Rally</span>
        <span class="brand-tag">Travel Network</span>
      </a>

      <ng-container *ngIf="currentUser()">
        <nav class="header-nav" [class.open]="mobileMenuOpen" role="navigation" aria-label="Main navigation">
          <a routerLink="/feed" routerLinkActive="active" (click)="closeMobileMenu()">Feed</a>
          <a routerLink="/quiz" routerLinkActive="active" (click)="closeMobileMenu()">Calibration</a>
          <a routerLink="/skills" routerLinkActive="active" (click)="closeMobileMenu()">Skill Swap</a>
          <a routerLink="/meetups" routerLinkActive="active" (click)="closeMobileMenu()">Meetups</a>
          <a routerLink="/subscription" routerLinkActive="active" (click)="closeMobileMenu()">Verified Membership</a>
          <a routerLink="/ai-chat" routerLinkActive="active" (click)="closeMobileMenu()">AI Assistant</a>
          <a routerLink="/pools" routerLinkActive="active" (click)="closeMobileMenu()">My Pools</a>
        </nav>
      </ng-container>

      <div class="header-actions">
        <ng-container *ngIf="currentUser() as user; else unauth">
          <a routerLink="/settings" class="user-pill" [attr.data-tooltip]="'Account Settings'">
            <span class="user-avatar">{{ user.first_name?.charAt(0) || 'R' }}</span>
            <span class="user-name">{{ user.first_name || 'Account' }}</span>
          </a>
          <button class="btn-ghost btn-logout" (click)="logout()" aria-label="Sign out">Sign out</button>
        </ng-container>

        <ng-template #unauth>
          <a routerLink="/login" class="btn-ghost">Sign in</a>
          <a routerLink="/register" class="btn-primary btn-sm">Create account</a>
        </ng-template>

        <button
          class="mobile-toggle"
          (click)="toggleMobileMenu()"
          [attr.aria-expanded]="mobileMenuOpen"
          aria-label="Toggle navigation menu"
        >
          <span class="toggle-bar" [class.open]="mobileMenuOpen"></span>
        </button>
      </div>
    </div>
  </header>

  <main class="main-content" role="main">
    <ng-content></ng-content>
  </main>

  <app-footer></app-footer>
</div>
