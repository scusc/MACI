<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Welcome back</h1>
      <p>Sign in to your Rally account to access your travel pools and network.</p>
    </div>

    <div *ngIf="errorMessage()" class="alert alert-error">
      {{ errorMessage() }}
    </div>

    <div class="oauth-section">
      <button type="button" class="btn-oauth" (click)="handleGoogleOAuth()">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.1 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12.3 0 15s.7 5.3 1.9 7.7l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.1-6.4-5.2L1.9 16C3.7 19.7 7.5 23 12 23z"/></svg>
        Continue with Google
      </button>

      <button type="button" class="btn-oauth btn-oauth-disabled" disabled data-tooltip="Coming soon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.32c.67-.82 1.12-1.95.99-3.09-.97.04-2.14.65-2.83 1.46-.62.72-1.16 1.88-1.01 3.01 1.08.08 2.18-.55 2.85-1.38z"/></svg>
        Continue with Apple
        <span class="coming-soon-tag">Soon</span>
      </button>
    </div>

    <div class="divider"><span>or continue with email</span></div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form" novalidate>
      <div class="form-group">
        <label for="login-email" class="form-label">Email address</label>
        <input
          id="login-email"
          type="email"
          formControlName="email"
          class="form-input"
          placeholder="you@example.com"
          [class.invalid]="loginForm.controls.email.invalid && loginForm.controls.email.touched"
          autocomplete="email"
        >
        <span *ngIf="loginForm.controls.email.touched && loginForm.controls.email.errors?.['email']" class="form-error">
          Please enter a valid email address.
        </span>
      </div>

      <div class="form-group">
        <label for="login-password" class="form-label">Password</label>
        <input
          id="login-password"
          type="password"
          formControlName="password"
          class="form-input"
          placeholder="Enter your password"
          [class.invalid]="loginForm.controls.password.invalid && loginForm.controls.password.touched"
          autocomplete="current-password"
        >
        <span *ngIf="loginForm.controls.password.touched && loginForm.controls.password.errors?.['minlength']" class="form-error">
          Password must be at least 6 characters.
        </span>
      </div>

      <button
        type="submit"
        class="btn-primary auth-submit"
        [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a routerLink="/register">Create account</a></p>
    </div>
  </div>
</div>
