<div class="auth-container">
  <div class="card auth-card">
    <h1 class="auth-title">Sign in to Slice</h1>
    <p class="auth-subtitle">Welcome back. Please enter your details.</p>

    <div *ngIf="errorMessage()" class="alert error">
      {{ errorMessage() }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="email" class="form-label">Email</label>
        <input 
          id="email" 
          type="email" 
          formControlName="email" 
          class="form-input" 
          placeholder="name@company.com"
          [class.invalid]="loginForm.controls.email.invalid && loginForm.controls.email.touched"
        >
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input 
          id="password" 
          type="password" 
          formControlName="password" 
          class="form-input" 
          placeholder="••••••••"
          [class.invalid]="loginForm.controls.password.invalid && loginForm.controls.password.touched"
        >
      </div>

      <button 
        type="submit" 
        class="btn-primary auth-submit" 
        [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>
    
    <div class="auth-footer">
      <p>Don't have an account? <a href="/register">Sign up</a></p>
    </div>
  </div>
</div>
