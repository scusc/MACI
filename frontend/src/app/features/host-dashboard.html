<div class="dashboard-container">
  <div class="dashboard-header">
    <h2>Host Dashboard</h2>
    <p>Manage your properties and receive direct payouts from Escrow pools.</p>
  </div>

  <div class="card onboarding-card">
    <div class="onboarding-header">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"></path><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
      <h3>Stripe Express Payouts</h3>
    </div>
    
    <div class="onboarding-body">
      <p>To list your asset and receive automated payouts when a pool's Escrow locks, you must verify your business identity and link a bank account.</p>
      
      <div class="status-indicator">
        <span class="status-dot"></span>
        Status: <strong>Not Connected</strong>
      </div>
    </div>
    
    <div class="onboarding-actions">
      <button class="btn-primary" (click)="startOnboarding()">Setup Payouts</button>
    </div>
  </div>
</div>
