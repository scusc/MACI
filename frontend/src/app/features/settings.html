<div class="page-container settings-page">
  <div class="section-header">
    <h1>Account Settings</h1>
    <p>Manage your profile and travel preferences.</p>
  </div>

  <!-- Profile Section -->
  <section class="settings-section">
    <div class="settings-section-title">Profile</div>

    <div class="settings-card">
      <!-- Avatar Preview -->
      <div class="avatar-section">
        <div class="avatar-large">
          <span>{{ firstName().charAt(0) || 'R' }}{{ lastName().charAt(0) || '' }}</span>
        </div>
        <div class="avatar-info">
          <div class="avatar-name">{{ firstName() }} {{ lastName() }}</div>
        </div>
      </div>

      <form (ngSubmit)="saveProfile()" class="settings-form">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">First Name</label>
            <input type="text" [ngModel]="firstName()" (ngModelChange)="firstName.set($event)" name="firstName" class="form-input" required />
          </div>
          <div class="form-group">
            <label class="form-label">Last Name</label>
            <input type="text" [ngModel]="lastName()" (ngModelChange)="lastName.set($event)" name="lastName" class="form-input" required />
          </div>
        </div>



        <div class="form-actions">
          <button type="submit" class="btn-primary" [disabled]="isSaving()">
            {{ isSaving() ? 'Saving...' : 'Save Changes' }}
          </button>
        </div>
      </form>
    </div>
  </section>

  <!-- Travel Preferences -->
  <section class="settings-section">
    <div class="settings-section-title">Travel Preferences</div>

    <div class="settings-card">
      <div class="form-group">
        <label class="form-label">Preferred Origin Airport (IATA)</label>
        <input type="text" [ngModel]="originAirport()" (ngModelChange)="originAirport.set($event)" name="originAirport" class="form-input" placeholder="e.g. JFK, SFO, DEL, LHR" />
      </div>

      <div class="form-group">
        <label class="form-label">Traveler Bio</label>
        <textarea rows="4" [ngModel]="bio()" (ngModelChange)="bio.set($event)" name="bio" class="form-textarea" placeholder="Tell fellow travelers about your travel style..."></textarea>
      </div>
    </div>
  </section>

  <!-- Sign Out -->
  <section class="settings-section">
    <div class="settings-section-title">Session</div>
    <div class="settings-card">
      <div class="session-row">
        <div>
          <div class="session-label">Sign out of your account</div>
          <div class="session-hint">You'll need to sign in again to access Rally.</div>
        </div>
        <button class="btn-secondary" (click)="signOut()">Sign Out</button>
      </div>
    </div>
  </section>
</div>
